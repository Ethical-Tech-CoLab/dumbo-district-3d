name: Publish viewer to GitHub Pages

# The viewer is a static site once built, and the whole district ships as JSON alongside it, so
# Pages is enough to host the thing people are actually asked to look at: the walkable twin, and the
# photo review sheet that decides which photographs become evidence.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; cancel a superseded run rather than racing it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the district
        uses: actions/checkout@v4
        with:
          path: dumbo-district-3d

      # The viewer consumes the shared kernel and contracts straight from the sibling repository
      # rather than from a published package, so CI has to reproduce that layout exactly.
      - name: Check out the shared contracts
        uses: actions/checkout@v4
        with:
          repository: Ethical-Tech-CoLab/digital-3d-shared-contracts
          path: digital-3d-shared-contracts

      # The bridge is another team's geometry and this repository only ever consumes it. Checking it
      # out here turns "our copy is stale" from something you notice by squinting at the render into
      # a build failure. It happened: the bridge team remodelled the tower arches and shipped it
      # under the same module_version, so nothing in the contract could tell us we were four hours
      # behind, and the only symptom was that the bridge looked subtly wrong.
      - name: Check out the bridge module
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: Ethical-Tech-CoLab/manhattan-bridge-3d
          path: manhattan-bridge-3d

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch the bridge module into the build
        # The bridge payload is deliberately NOT committed here -- it is another team's geometry and
        # the standing obligation in MILESTONES.md forbids vendoring it. The consequence, until this
        # was added, was that the published site shipped no bridge at all: every reviewer looking at
        # Pages saw a placeholder where the Manhattan Bridge should be, while it rendered fine on a
        # developer's machine, because only they had the sibling checkout.
        #
        # Fetching it at build time from the repository that owns it satisfies both halves: the
        # geometry stays theirs, and the thing people are asked to review is complete. The script
        # prints a digest for every file it replaces, so drift is visible in the build log.
        continue-on-error: true
        run: |
          if [ -d manhattan-bridge-3d/viewer/public ]; then
            python3 dumbo-district-3d/scripts/sync_bridge_module.py \
              --source manhattan-bridge-3d/viewer/public
          else
            echo "::warning::bridge repository unavailable; the site will ship without the bridge"
          fi

      - name: Install
        working-directory: dumbo-district-3d/viewer
        run: npm install

      - name: Typecheck
        working-directory: dumbo-district-3d/viewer
        run: npx tsc --noEmit

      - name: Build
        working-directory: dumbo-district-3d/viewer
        run: npm run build

      - name: Report what shipped
        working-directory: dumbo-district-3d/viewer/dist
        run: |
          echo "tile payloads : $(ls district/tiles 2>/dev/null | wc -l)"
          echo "review sheet  : $([ -f review/index.html ] && echo present || echo MISSING)"
          echo "bridge module : $([ -f modules/manhattan-bridge/bridge-manifest.json ] && echo present || echo MISSING)"
          du -sh .

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dumbo-district-3d/viewer/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
